<script>
$(document).ready(function () {
	
	//nav當前頁active
	navActive('collection');
	
	//點[活動專區]各項目，篩選出各項目內容 
	var $grid = $('.isotope-list').isotope({
		itemSelector: '.isotope-item',
		layoutMode: 'fitRows',
	});
	//點.activity-nav選單
	var $buttonGroup = $('.isotope-nav');
	$buttonGroup.on( 'click', 'a', function( event ) {
		
		event.preventDefault();
		
		var $button = $( event.currentTarget );
		var filterValue = $button.attr('data-filter');
		$grid.isotope({ filter: filterValue });
		isotopeNone(filterValue);
	});
	//點其他頁navi-main、footer-info__sitemap選單
	$hash= document.location.hash.substring(1);
	if($hash.length!=0){
		filterValue = '.'+$hash;
		$grid.isotope({ filter: filterValue });
		isotopeNone(filterValue);
	}
	//點此頁navi-main、footer-info__sitemap選單
	//$('.navi-main ul li a, .footer-info__sitemap ul li a').click(function(){
	$(window).on( 'hashchange', function() {
		var $hash = document.location.hash.substr(1);
		filterValue = '.'+$hash;
		$grid.isotope({ filter: filterValue });
		isotopeNone(filterValue);
	})
	
});
	function isotopeNone(filterValue) {
	 $('.isotope-nav a').removeClass('active')
					 .filter('[data-filter="' + filterValue + '"]')
					 .addClass('active');
	
	var nowText = $('.isotope-nav a.active').text();
	$('.breadcrumb li:last-child').text(nowText);
	
	let hasItem;

	if (filterValue === '*') {
		hasItem = $('.isotope-item').length > 0;
	} else {
		hasItem = $('.isotope-item' + filterValue).length > 0;
	}
	
	if (!hasItem) {
		$('.isotope-list').css('height', 'auto')
					   .find('.isotope-list-none')
					   .text('目前无新闻。');
	} else {
		$('.isotope-list-none').text('');
	}
	
	$('html,body').animate({scrollTop:0},0);
}	
</script>
